# Dos veces al día: añade el precio medio al histórico y redespliega la web.
#
# Las páginas "cuánto cuesta poner...", "horas baratas", "precio de mañana" y el bloque de
# tendencia se generan EN EL BUILD con el PVPC, así que sin esto mostrarían los precios de
# ayer. Si el histórico cambia, el propio commit dispara el despliegue de Vercel; si no,
# se llama al deploy hook.
name: Rebuild diario

on:
  schedule:
    # Pasada de la TARDE. Red Eléctrica publica los precios del día siguiente a partir de
    # las 20:15 peninsulares, y /precio-luz-manana/ los necesita escritos en el HTML: sin
    # este build, esa página se queda todo el día diciendo que aún no hay datos.
    # 20:30 UTC son las 22:30 en verano y las 21:30 en invierno, con margen de sobra sobre
    # la hora de publicación en los dos horarios y sobre los retrasos de la cola de GitHub.
    - cron: '30 20 * * *'
    # Pasada de MEDIANOCHE. 23:15 UTC es poco después de medianoche peninsular (00:15 en
    # invierno, 01:15 en verano): arranca el día nuevo con sus precios ya en su sitio.
    - cron: '15 23 * * *'
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necesario para comitear el histórico
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Añadir el día de hoy al histórico
        run: node scripts/historico.mjs

      - name: Comitear si hay cambios
        id: commit
        run: |
          if git diff --quiet -- src/data/historico.json; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            echo "El histórico no ha cambiado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/historico.json
            git commit -m "Histórico del precio de la luz: $(date -u +%Y-%m-%d)"
            git push
            echo "cambios=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Redesplegar si no hubo commit
        if: steps.commit.outputs.cambios == 'no'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Falta el secreto VERCEL_DEPLOY_HOOK (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Despliegue solicitado a Vercel."
